<!doctype html>
<html lang="en" data-theme="default">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F1EDE4">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gym">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Gym</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
@font-face{font-family:"Barlow";font-weight:400;font-display:swap;src:url(fonts/barlow-400.woff2) format("woff2")}
@font-face{font-family:"Barlow";font-weight:500;font-display:swap;src:url(fonts/barlow-500.woff2) format("woff2")}
@font-face{font-family:"Barlow";font-weight:600;font-display:swap;src:url(fonts/barlow-600.woff2) format("woff2")}
@font-face{font-family:"Barlow Condensed";font-weight:600;font-display:swap;src:url(fonts/barlow-condensed-600.woff2) format("woff2")}
@font-face{font-family:"Barlow Condensed";font-weight:700;font-display:swap;src:url(fonts/barlow-condensed-700.woff2) format("woff2")}
@font-face{font-family:"Cousine";font-weight:400;font-display:swap;src:url(fonts/cousine-400.woff2) format("woff2")}

:root{
  --bg:#F1EDE4; --surface:#FAF8F3; --raised:#FFFFFF; --ink:#191713; --muted:#6B6558; --faint:#A19A8B;
  --line:#D9D2C4; --accent:#D5401C; --on-accent:#FFFFFF; --done-bg:#F6E3DA;
  --shadow:0 1px 0 rgba(25,23,19,.05),0 10px 28px -16px rgba(25,23,19,.28);
  --cond:"Barlow Condensed","Arial Narrow",system-ui,sans-serif; --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"Cousine",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
[data-theme="stealth"]{
  --bg:#09090A; --surface:#111113; --raised:#18181B; --ink:#C9C7C2; --muted:#85837D; --faint:#55534F;
  --line:#242428; --accent:#C9C7C2; --on-accent:#09090A; --done-bg:#1C1C1F; --shadow:none;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.4 var(--body);-webkit-tap-highlight-color:transparent;touch-action:manipulation;
  min-height:100dvh;padding-bottom:calc(var(--dock,0px) + env(safe-area-inset-bottom))}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-user-select:none;user-select:none}
a{color:inherit}
h1,h2,h3,p{margin:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app{max-width:540px;margin:0 auto;padding:0 18px 28px}
.view{animation:in .16s ease-out}
@keyframes in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* ---------- shared ---------- */
.caps{font:600 12.5px/1 var(--cond);letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:56px;padding:0 20px;border:1.5px solid var(--ink);border-radius:14px;background:transparent;
  font:700 20px/1 var(--cond);letter-spacing:.08em;text-transform:uppercase;transition:transform .08s,opacity .15s}
.btn:active{transform:scale(.985)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.ink{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.quiet{border-color:var(--line);font-size:17px;min-height:50px}
.btn.danger{border-color:var(--line);color:var(--accent)}
.btn[disabled]{opacity:.4;pointer-events:none}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow)}
.bar{position:sticky;top:0;z-index:5;display:grid;grid-template-columns:76px 1fr 76px;align-items:center;margin:0 -18px;padding:calc(10px + env(safe-area-inset-top)) 12px 10px;background:var(--bg);border-bottom:1px solid var(--line)}
.bar h1{font:700 22px/1.1 var(--cond);letter-spacing:.06em;text-transform:uppercase;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .back{justify-self:start;display:flex;align-items:center;gap:2px;min-height:44px;padding:0 8px 0 2px;border:0;background:none;font:600 16px var(--body);color:var(--muted)}
.bar .side{justify-self:end;padding-right:6px;font:600 20px/1 var(--cond);letter-spacing:.04em;font-variant-numeric:tabular-nums;color:var(--muted)}
.empty{padding:44px 8px;text-align:center;color:var(--muted)}
.fine{font-size:14px;color:var(--muted);line-height:1.45}
.fine b{color:var(--ink);font-weight:600}

/* ---------- home ---------- */
.top{display:flex;align-items:flex-end;justify-content:space-between;padding:calc(20px + env(safe-area-inset-top)) 2px 16px}
.mark{display:flex;align-items:baseline;gap:10px}
.mark b{font:700 46px/.82 var(--cond);letter-spacing:.01em}
.mark b i{font-style:normal;color:var(--accent)}
.mark span{font:400 11.5px/1 var(--mono);color:var(--faint)}
.theme{min-height:44px;padding:0 14px;border:1px solid var(--line);border-radius:999px;background:transparent;font:600 12.5px/1 var(--cond);letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.due{position:relative;overflow:hidden}
.due .caps{display:flex;justify-content:space-between}
.due h2{margin:10px 0 2px;font:700 46px/.95 var(--cond);letter-spacing:.005em;text-transform:uppercase}
.due .venue{font-weight:500;color:var(--muted)}
.due ul{list-style:none;margin:14px 0 16px;padding:0;border-top:1px solid var(--line)}
.due li{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:15.5px}
.due li b{font:600 18px/1.2 var(--cond);letter-spacing:.03em;white-space:nowrap}
.due .unset{margin:10px 0 0;color:var(--muted);font-size:15px}
.resume{margin-bottom:14px;border-color:var(--ink)}
.resume h2{margin:8px 0 2px;font:700 30px/1 var(--cond);text-transform:uppercase}
.resume p{color:var(--muted);font-size:15px;margin-bottom:14px}
.resume .row2{grid-template-columns:2fr 1fr}
.lane{margin-top:30px}
.lane-h{display:flex;align-items:baseline;justify-content:space-between;padding:0 2px 8px;border-bottom:2px solid var(--ink)}
.lane-h h3{font:700 15px/1 var(--cond);letter-spacing:.2em;text-transform:uppercase}
.lane-h span{font-size:13.5px;color:var(--muted)}
.rt{display:grid;grid-template-columns:1fr auto;align-items:center;gap:12px;width:100%;min-height:68px;padding:11px 2px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left}
.rt:active{background:var(--surface)}
.rt b{display:block;font:600 25px/1.05 var(--cond);letter-spacing:.02em;text-transform:uppercase}
.rt small{display:block;margin-top:3px;font-size:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rt .go{display:flex;align-items:center;gap:8px;color:var(--faint)}
.pill{padding:5px 8px 4px;border-radius:6px;background:var(--accent);color:var(--on-accent);font:700 12px/1 var(--cond);letter-spacing:.14em}
.foot{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:30px}
.foot a{display:block;padding:14px 16px;border:1px solid var(--line);border-radius:14px;text-decoration:none;background:var(--surface)}
.foot a b{display:block;font:700 19px/1 var(--cond);letter-spacing:.08em;text-transform:uppercase}
.foot a small{display:block;margin-top:5px;font-size:13.5px;color:var(--muted)}
.foot a.warn small{color:var(--accent)}

/* ---------- session ---------- */
.prog{position:sticky;top:calc(65px + env(safe-area-inset-top));z-index:4;height:3px;margin:0 -18px;background:var(--line)}
.prog i{display:block;height:100%;width:0;background:var(--accent);transition:width .25s}
.snote{display:block;width:100%;margin:16px 0 4px;padding:13px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);resize:none;min-height:50px}
.snote::placeholder{color:var(--faint)}
.ex{margin-top:14px;padding:18px 16px 14px;border:1px solid var(--line);border-radius:18px;background:var(--surface);box-shadow:var(--shadow)}
.ex-h{display:grid;grid-template-columns:auto 1fr auto;align-items:start;gap:10px}
.ex-n{font:700 15px/1.75 var(--cond);letter-spacing:.08em;color:var(--faint);font-variant-numeric:tabular-nums}
.ex h2{font:700 27px/1.02 var(--cond);letter-spacing:.015em;text-transform:uppercase}
.skip{min-height:36px;margin:-4px -4px 0 0;padding:0 12px;border:1px solid var(--line);border-radius:999px;background:none;font:600 12px/1 var(--cond);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.ex-meta{margin-top:8px;font-size:15.5px;color:var(--muted)}
.ex-meta b{font-weight:600;color:var(--ink)}
.ex-log{display:flex;gap:8px;align-items:baseline;margin-top:8px;font-size:14.5px;color:var(--muted)}
.tag{flex:none;padding:3px 6px 2px;border:1px solid var(--line);border-radius:5px;font:700 11.5px/1 var(--cond);letter-spacing:.14em;text-transform:uppercase;color:var(--ink)}
.tag.opt{color:var(--muted)}
.ex-cue{margin-top:8px;font-size:15px;font-style:italic}
.ex-note{margin-top:6px;font-size:14.5px;color:var(--muted)}
.ex-form{display:flex;gap:16px;margin-top:8px;font-size:14px}
.ex-form a{color:var(--muted);text-underline-offset:3px}
.sets{margin-top:14px}
.set-h,.set{display:grid;grid-template-columns:30px 1fr 1fr 60px;gap:8px;align-items:center}
.set-h{padding:0 0 6px}
.set-h span{font:600 11.5px/1 var(--cond);letter-spacing:.16em;text-transform:uppercase;color:var(--faint);text-align:center}
.set-h span:first-child{text-align:left}
.set{margin-top:8px}
.set:first-of-type{margin-top:0}
.set-n{font:700 20px/1 var(--cond);color:var(--faint);font-variant-numeric:tabular-nums}
.set input{width:100%;min-width:0;height:54px;padding:0 6px;border:1.5px solid var(--line);border-radius:12px;background:var(--raised);text-align:center;font:600 26px/1 var(--cond);letter-spacing:.02em;font-variant-numeric:tabular-nums;-moz-appearance:textfield}
.set input::placeholder{color:var(--faint);font-weight:600;font-size:17px;letter-spacing:.1em}
.set input:focus{outline:0;border-color:var(--ink)}
.chk{display:grid;place-items:center;height:54px;border:1.5px solid var(--line);border-radius:12px;background:var(--raised);color:transparent;transition:transform .1s,background .12s,border-color .12s}
.chk svg{width:26px;height:26px}
.chk:active{transform:scale(.94)}
.set.done .chk{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.set.done input{background:var(--done-bg);border-color:transparent}
.set.done .set-n{color:var(--ink)}
.ex.skipped{box-shadow:none;background:transparent}
.ex.skipped h2{color:var(--faint);text-decoration:line-through;text-decoration-thickness:2px}
.ex.skipped .ex-meta,.ex.skipped .ex-log,.ex.skipped .ex-cue,.ex.skipped .ex-note,.ex.skipped .ex-form,.ex.skipped .sets{display:none}

/* ---------- dock: timer sits above Finish, never over it ---------- */
#dock{position:fixed;left:0;right:0;bottom:0;z-index:10;padding:0 14px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--bg) 72%,transparent);pointer-events:none}
#dock>div{max-width:512px;margin:0 auto;pointer-events:auto}
#dock:empty{display:none}
.timer{margin-bottom:8px;border:1.5px solid var(--ink);border-radius:14px;background:var(--surface);overflow:hidden;box-shadow:var(--shadow)}
.timer .slim{position:relative;display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:10px;width:100%;min-height:46px;padding:0 6px 0 14px;border:0;background:none;text-align:left}
.timer .fill{position:absolute;inset:0;width:0;background:var(--done-bg);transition:width .25s linear}
.timer .slim>:not(.fill){position:relative}
.timer .lab{font:600 13px/1 var(--cond);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.timer .t{font:700 26px/1 var(--cond);letter-spacing:.03em;font-variant-numeric:tabular-nums}
.timer .x{display:grid;place-items:center;width:40px;height:40px;border:0;background:none;color:var(--muted);font-size:22px;line-height:1}
.timer .big{display:none;padding:6px 14px 16px;text-align:center;border-top:1px solid var(--line)}
.timer.open .big{display:block}
.timer.open .slim .t{visibility:hidden}
.timer .big .t{font-size:88px;line-height:1.05}
.timer .big .row2{margin-top:8px}
.timer.over{border-color:var(--accent)}
.timer.over .slim .t{color:var(--accent)}
.timer.over .fill{width:100%!important;animation:pulse 1.1s ease-in-out 4}
@keyframes pulse{50%{opacity:.25}}

/* ---------- history ---------- */
.hrow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;width:100%;min-height:66px;padding:12px 2px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left}
.hrow b{display:block;font:600 23px/1.05 var(--cond);letter-spacing:.02em;text-transform:uppercase}
.hrow small{display:block;margin-top:3px;font-size:14px;color:var(--muted)}
.hrow .n{font:700 22px/1 var(--cond);font-variant-numeric:tabular-nums;text-align:right}
.hrow .n small{font:600 11px/1 var(--cond);letter-spacing:.14em;text-transform:uppercase}
.sum{margin:16px 0;padding:16px;border:1px solid var(--line);border-radius:14px;background:var(--surface);font:400 13.5px/1.55 var(--mono);white-space:pre-wrap;word-break:break-word;-webkit-user-select:text;user-select:text}
.stack>*+*{margin-top:10px}

/* ---------- backup ---------- */
.sec{margin-top:26px}
.sec>h2{padding-bottom:8px;margin-bottom:12px;border-bottom:2px solid var(--ink);font:700 15px/1 var(--cond);letter-spacing:.2em;text-transform:uppercase}
.sec .fine{margin-bottom:12px}
.code{width:100%;height:132px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);font:400 12px/1.6 var(--mono);letter-spacing:.02em;resize:vertical;white-space:pre;overflow:auto}
#load-text{font-size:16px;line-height:1.45}
.code::placeholder{font-family:var(--body);font-size:15px;letter-spacing:0;color:var(--faint);white-space:normal}
.shots{display:grid;gap:12px;margin-top:12px}
.shot{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
.shot img{display:block;width:100%;height:auto}
.shot .btn{border:0;border-top:1px solid var(--line);border-radius:0;color:#191713;min-height:50px;font-size:16px}
.status{margin-top:12px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;font-size:14.5px;line-height:1.45}
.status.bad{border-color:var(--accent)}
.status:empty{display:none}
input[type=file]{display:none}

#toast{position:fixed;left:50%;bottom:calc(var(--dock,0px) + 22px + env(safe-area-inset-bottom));z-index:20;transform:translate(-50%,12px);max-width:min(92vw,480px);padding:12px 16px;border-radius:12px;background:var(--ink);color:var(--bg);font-weight:500;font-size:15px;text-align:center;opacity:0;pointer-events:none;transition:opacity .18s,transform .18s}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<div id="dock"></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
"use strict";
/* =====================================================================
   PROGRAM — the only place loads live. Edit here, bump VERSION, push.
   When open loads change, change in ONE edit: the exercise's
   defaultWeight / defaultReps / target / note, the routine blurb,
   and TARGETS below.
   ===================================================================== */
const VERSION = "2026.11.17-8";

// Home targets card. A label written when a session is graded, not computed.
const TARGETS = {
  due: null,                 // routine id, e.g. "work_pull"
  venue: "",                 // e.g. "Office gym"
  loads: [],                 // e.g. [["Seated row", "130 × 12"]]
  updated: ""                // e.g. "17 Nov"
};

// Lanes: different buildings, different machines. Pins never cross lanes.
const LANES = [
  { key: "home",    label: "Home",     venue: "Home",        prefix: "" },
  { key: "work",    label: "Work",     venue: "Office gym",  prefix: "work_" },
  { key: "daypass", label: "Day-pass", venue: "Unity",       prefix: "unity_" }
];

/* Cards. Pull and Push in each lane for now; a lane shows up on the home screen once it has a card.
   Ids still to come: legs, easy (home) · work_legs, work_easy.
   Rests that have worked: main row/press 120 · assisted pull-up 150 · face pull / rear delt 90
   · arms 75 · easy finisher 60. */
const ROUTINES = [
  // All six cards start as the same two Hevy routines by tanookit, copied 17 Nov: "Comeback Pull" (hevy.com/routine/Sw3uOnimAp7)
  // and "Comeback Push" (hevy.com/routine/UqQ13NmZ6RU). Neither has a warm-up row; Push lists no loads.
  // They are separate objects on purpose: a session graded at one gym changes that gym's card only.

  // ---- Home ----
  { id: "pull", name: "Home Pull", blurb: "Row 85 · assist 100 · face pull 25", exercises: [
    { name: "Seated cable row — V grip", sets: 3, repTarget: "10", rest: 120, target: "85", log: "cable", defaultWeight: 85, defaultReps: "10",
      note: "All sets top of range clean → bump next time." },
    { name: "Assisted pull-up", sets: 3, repTarget: "5", rest: 150, target: "assist 100", log: "assist", defaultWeight: 100, defaultReps: "5",
      note: "Chase a clean 3rd set. Ugly → more assist." },
    { name: "Face pull", sets: 3, repTarget: "20", rest: 90, target: "25", log: "cable", defaultWeight: 25, defaultReps: "20",
      cue: "Full finish, no shrug-cheat." },
    { name: "Single-arm cable reverse fly", sets: 3, repTarget: "10", rest: 90, target: "12.5–15", log: "cable", defaultReps: "10",
      note: "Slight-down OK." },
    { name: "Cable bicep curl", sets: 3, repTarget: "15", rest: 75, target: "35–40, feel it out", log: "cable", defaultReps: "15",
      note: "No fly handles." },
    { name: "Seated incline dumbbell curl", sets: 2, repTarget: "6-12", rest: 75, target: "20–25 per hand", log: "db",
      note: "Both DBs · 20–25, not 40." },
    { name: "EZ bar biceps curl", sets: 3, repTarget: "10", rest: 45, target: "plates 2×10 + 2×2.5", log: "bar", defaultReps: "10", optional: true,
      cue: "Strict.", note: "Plate math: 2×10, 2×2.5." },
    { name: "Concentration curl", sets: 2, repTarget: "6", log: "db", defaultReps: "6", optional: true,
      cue: "Slow negative.", note: "Assisted lift." }
  ]},
  { id: "push", name: "Home Push", blurb: "Loads not set yet — first session sets the openers", exercises: [
    { name: "Dumbbell bench press", sets: 3, repTarget: "10-12", rest: 90, log: "db" },
    { name: "Seated cable chest fly", sets: 3, repTarget: "10", rest: 90, log: "cable", defaultReps: "10" },
    { name: "Incline dumbbell chest fly", sets: 3, repTarget: "10", rest: 90, log: "db", defaultReps: "10" },
    { name: "Triceps pushdown", sets: 3, repTarget: "12", rest: 60, log: "cable", defaultReps: "12" },
    { name: "Dumbbell lateral raise", sets: 3, repTarget: "10", rest: 60, log: "db", defaultReps: "10" },
    { name: "Face pull", sets: 2, repTarget: "20", rest: 45, log: "cable", defaultReps: "20" },
    { name: "Dumbbell triceps kickback", sets: 2, repTarget: "12", rest: 45, log: "db", defaultReps: "12" },
    { name: "Single-arm cable crossover", sets: 2, repTarget: "15", rest: 45, log: "cable", defaultReps: "15", cue: "Burn · continuous." },
    { name: "Barbell bench press", sets: 2, repTarget: "12", log: "bar", defaultReps: "12", cue: "Stretch · slow eccentric." },
    { name: "Push-up", sets: 2, rest: 60, log: "bodyweight", note: "Mechanical drop OK." }
  ]},

  // ---- Work (office gym) ----
  { id: "work_pull", name: "Work Pull", blurb: "Row 85 · assist 100 · face pull 25", exercises: [
    { name: "Seated cable row — V grip", sets: 3, repTarget: "10", rest: 120, target: "85", log: "cable", defaultWeight: 85, defaultReps: "10",
      note: "All sets top of range clean → bump next time." },
    { name: "Assisted pull-up", sets: 3, repTarget: "5", rest: 150, target: "assist 100", log: "assist", defaultWeight: 100, defaultReps: "5",
      note: "Chase a clean 3rd set. Ugly → more assist." },
    { name: "Face pull", sets: 3, repTarget: "20", rest: 90, target: "25", log: "cable", defaultWeight: 25, defaultReps: "20",
      cue: "Full finish, no shrug-cheat." },
    { name: "Single-arm cable reverse fly", sets: 3, repTarget: "10", rest: 90, target: "12.5–15", log: "cable", defaultReps: "10",
      note: "Slight-down OK." },
    { name: "Cable bicep curl", sets: 3, repTarget: "15", rest: 75, target: "35–40, feel it out", log: "cable", defaultReps: "15",
      note: "No fly handles." },
    { name: "Seated incline dumbbell curl", sets: 2, repTarget: "6-12", rest: 75, target: "20–25 per hand", log: "db",
      note: "Both DBs · 20–25, not 40." },
    { name: "EZ bar biceps curl", sets: 3, repTarget: "10", rest: 45, target: "plates 2×10 + 2×2.5", log: "bar", defaultReps: "10", optional: true,

/* Numbered lists the save code leans on: it writes a card or a lift as its position here instead of its name.

   A lift that is not listed still works; its name is spelled out in the code, which only costs letters. */

const LIFTS = [

/* =====================================================================
   State
   ===================================================================== */
const KEY = "gym_tracker_v1";
const $ = (s, r) => (r || document).querySelector(s);
const app = $("#app"), dock = $("#dock");
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pad2 = n => String(n).padStart(2, "0");

function normState(o) {
  o = o && typeof o === "object" ? o : {};
  return {
    workouts: Array.isArray(o.workouts) ? o.workouts.filter(w => w && typeof w === "object") : [],
    draft: o.draft && typeof o.draft === "object" && Array.isArray(o.draft.exercises) ? o.draft : null,
    theme: o.theme === "stealth" ? "stealth" : "default",
    backup: o.backup && typeof o.backup === "object" ? o.backup : null
  };
}
function loadState() {
  let raw = null;
  try { raw = localStorage.getItem(KEY); } catch (e) { return normState(null); }
  if (!raw) return normState(null);
  try { return normState(JSON.parse(raw)); }
  catch (e) { try { localStorage.setItem(KEY + "_unreadable_" + Date.now(), raw); } catch (e2) {} return normState(null); }
}
let S = loadState(), saveWarned = false;
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); }
  catch (e) { if (!saveWarned) { saveWarned = true; toast("This browser refused to store data. Back up from History before closing.", 6000); } }
}

/* =====================================================================
   Small helpers
   ===================================================================== */
const hm = iso => { const d = new Date(iso); return isNaN(d) ? "—" : pad2(d.getHours()) + ":" + pad2(d.getMinutes()); };
const day = iso => { const d = new Date(iso); return isNaN(d) ? "—" : d.toLocaleDateString(undefined, { weekday: "short", day: "numeric", month: "short" }); };
const mmss = sec => { sec = Math.max(0, Math.round(sec)); const m = Math.floor(sec / 60); return (m >= 60 ? Math.floor(m / 60) + ":" + pad2(m % 60) : m) + ":" + pad2(sec % 60); };
const restText = mmss;
const doneSets = s => (s.exercises || []).reduce((n, e) => n + (e.sets || []).filter(x => x && x.done).length, 0);
const allSets = s => (s.exercises || []).reduce((n, e) => n + (e.skipped ? 0 : (e.sets || []).length), 0);
const minutes = s => { const a = Date.parse(s.startedAt), b = Date.parse(s.finishedAt); return isNaN(a) || isNaN(b) ? null : Math.max(1, Math.round((b - a) / 60000)); };
function laneOf(id) { id = String(id || ""); return LANES.find(l => l.prefix && id.startsWith(l.prefix)) || LANES[0]; }
const patternOf = id => String(id || "").slice(laneOf(id).prefix.length);
const routine = id => ROUTINES.find(r => r.id === id);

let toastT;
function toast(msg, ms) {
  const t = $("#toast"); t.textContent = msg; t.classList.add("on");
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("on"), ms || 2600);
}
async function copyText(text) {
  try { if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(text); return true; } } catch (e) {}
  try {
    const ta = document.createElement("textarea");
    ta.value = text; ta.setAttribute("readonly", ""); ta.style.cssText = "position:fixed;top:0;left:0;opacity:0";
    document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, text.length);
    const ok = document.execCommand("copy"); ta.remove(); return !!ok;
  } catch (e) { return false; }
}
function selectNode(el) { try { const r = document.createRange(); r.selectNodeContents(el); const s = getSelection(); s.removeAllRanges(); s.addRange(r); } catch (e) {} }
const ICON = {
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  chev: '<svg width="10" height="16" viewBox="0 0 10 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 2l6 6-6 6"/></svg>',
  back: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>'
};

/* =====================================================================
   Sessions
   ===================================================================== */
function newSession(r) {
  return {
    routineId: r.id, name: r.name, startedAt: new Date().toISOString(), note: "",
    exercises: r.exercises.map(e => ({
      name: e.name, repTarget: e.repTarget || "", rest: e.rest || 0, target: e.target || "", note: e.note || "",
      log: e.log || "", cue: e.cue || "", form: e.form || null, optional: !!e.optional,
      sets: Array.from({ length: Math.max(1, e.sets || 1) }, () => ({
        w: e.defaultWeight == null ? "" : String(e.defaultWeight),
        r: e.defaultReps == null ? "" : String(e.defaultReps),
        done: false
      }))
    }))
  };
}
function startRoutine(id) {
  const r = routine(id); if (!r) return;
  if (S.draft) {
    if (S.draft.routineId === id) return go("#/session");
    if (!confirm("Discard the unfinished " + S.draft.name + " (" + doneSets(S.draft) + " sets checked) and start " + r.name + "?")) return;
  }
  // Same pattern in a different lane on the same day needs an explicit yes.
  const today = new Date().toDateString();
  const clash = S.workouts.find(w => new Date(w.startedAt).toDateString() === today && patternOf(w.routineId) === patternOf(id) && laneOf(w.routineId).key !== laneOf(id).key);
  if (clash && !confirm("You already logged " + clash.name + " today. Start " + r.name + " as well?")) return;
  S.draft = newSession(r); save(); go("#/session");
}
function setLine(e, x) {
  const w = String(x.w == null ? "" : x.w).trim(), r = String(x.r == null ? "" : x.r).trim();
  return (w || (e.log === "bodyweight" ? "bw" : "—")) + " x " + (r || "—");
}
function summary(s) {
  const L = [s.name || "Workout", "started " + hm(s.startedAt) + " · finished " + (s.finishedAt ? hm(s.finishedAt) : "—")];
  if (s.note && String(s.note).trim()) L.push("note: " + String(s.note).trim());
  for (const e of s.exercises || []) {
    const head = [e.name, e.log, e.target ? "target " + e.target : ""].filter(Boolean).join("  ");
    const done = (e.sets || []).filter(x => x && x.done);
    L.push("");
    if (e.skipped || (e.optional && !done.length)) { L.push(head + "  — skipped (optional)"); continue; }
    L.push(head);
    if (!done.length) L.push("  no sets logged"); else for (const x of done) L.push("  " + setLine(e, x));
  }
  return L.join("\n");
}
async function finish() {
  const d = S.draft; if (!d) return;
  if (!doneSets(d)) return toast("Check at least one set first");
  d.finishedAt = new Date().toISOString();
  S.workouts.push(d); S.draft = null; save(); stopRest();
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  const ok = await copyText(summary(d));
  if (ok) { go("#/"); toast("Saved · summary copied"); }
  else { go("#/history/" + (S.workouts.length - 1)); toast("Saved. Copy failed — the text is selected, copy it by hand.", 5000); setTimeout(() => { const el = $(".sum"); if (el) selectNode(el); }, 80); }
}

/* =====================================================================
   Rest timer, beep, wake lock
   ===================================================================== */
const T = { state: "idle", endAt: 0, total: 0, label: "", open: false, iv: null };
let AC = null, WL = null;
function audioReady() { try { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === "suspended") AC.resume(); } catch (e) {} }
function beep() {
  try {
    if (!AC) return; const t = AC.currentTime, o = AC.createOscillator(), g = AC.createGain();
    o.type = "sine"; o.frequency.value = 880; g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.5, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.45);
    o.connect(g).connect(AC.destination); o.start(t); o.stop(t + 0.5);
  } catch (e) {}
}
function startRest(sec, label) {
  if (!sec) return;
  T.state = "run"; T.total = sec; T.endAt = Date.now() + sec * 1000; T.label = label;
  renderDock(); if (!T.iv) T.iv = setInterval(tickRest, 250);
}
function stopRest() { T.state = "idle"; clearInterval(T.iv); T.iv = null; renderDock(); }
function tickRest() {
  if (T.state !== "run") return;
  const left = (T.endAt - Date.now()) / 1000;
  if (left <= 0) {            // zero: beep once, collapse itself
    T.state = "over"; T.open = false; clearInterval(T.iv); T.iv = null;
    beep(); try { navigator.vibrate && navigator.vibrate([180, 90, 180]); } catch (e) {}
    return renderDock();
  }
  dock.querySelectorAll(".t").forEach(el => el.textContent = mmss(Math.ceil(left)));
  const f = $(".fill", dock); if (f) f.style.width = (100 - (left / T.total) * 100).toFixed(1) + "%";
}
async function wakeOn() { try { if ("wakeLock" in navigator && !WL) { WL = await navigator.wakeLock.request("screen"); WL.addEventListener("release", () => { WL = null; }); } } catch (e) {} }
function wakeOff() { try { WL && WL.release(); } catch (e) {} WL = null; }
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") { if (view === "session") wakeOn(); tickRest(); } });

function renderDock() {
  if (view !== "session" || !S.draft) { dock.innerHTML = ""; return setDock(); }
  let t = "";
  if (T.state !== "idle") {
    const over = T.state === "over", left = over ? 0 : Math.ceil((T.endAt - Date.now()) / 1000);
    t = '<div class="timer' + (T.open ? " open" : "") + (over ? " over" : "") + '">' +
      '<div class="slim" data-act="timer-toggle" role="button" tabindex="0" aria-label="Rest timer"><i class="fill"></i>' +
      '<span class="lab">' + (over ? "Rest over · " : "Rest · ") + esc(T.label) + '</span><span class="t">' + mmss(left) + '</span>' +
      '<button class="x" data-act="timer-stop" aria-label="Dismiss timer">×</button></div>' +
      '<div class="big"><div class="t">' + mmss(left) + '</div><div class="row2"><button class="btn quiet" data-act="timer-add">+30 s</button><button class="btn quiet" data-act="timer-stop">Skip rest</button></div></div></div>';
  }
  dock.innerHTML = "<div>" + t + '<button class="btn ink" data-act="finish">Finish workout</button></div>';
  setDock(); tickRest();
}
function setDock() { document.body.style.setProperty("--dock", dock.offsetHeight + "px"); }

/* =====================================================================
   Views
   ===================================================================== */
let view = "home", clock = null;
function go(hash) { if (location.hash === hash || (hash === "#/" && !location.hash)) render(); else location.hash = hash; }
window.addEventListener("hashchange", render);

function render() {
  const h = location.hash.replace(/^#\/?/, ""), parts = h.split("/");
  const prev = view;
  view = parts[0] === "session" && S.draft ? "session" : parts[0] === "history" ? "history" : parts[0] === "backup" ? "backup" : "home";
  clearInterval(clock); clock = null;
  if (prev === "session" && view !== "session") { wakeOff(); stopRest(); }
  if (view === "session") { viewSession(); wakeOn(); }
  else if (view === "history") { parts[1] != null && parts[1] !== "" ? viewWorkout(+parts[1]) : viewHistory(); }
  else if (view === "backup") viewBackup();
  else viewHome();
  renderDock();
  if (prev !== view || view !== "session") window.scrollTo(0, 0);
}

/* ---------- home ---------- */
function viewHome() {
  const due = routine(TARGETS.due);
  let h = '<div class="view"><header class="top"><div class="mark"><b>GYM<i>.</i></b><span>v' + esc(VERSION) + '</span></div>' +

  }

  if (due) {

    if (TARGETS.loads && TARGETS.loads.length) h += "<ul>" + TARGETS.loads.map(l => Array.isArray(l) ? "<li><span>" + esc(l[0]) + "</span><b>" + esc(l[1]) + "</b></li>" : "<li><span>" + esc(l) + "</span></li>").join("") + "</ul>";
    else h += '<p class="unset">No open loads written for this card.</p><div style="height:14px"></div>';

        (TARGETS.due === r.id ? '<span class="pill">DUE</span>' : "") + ICON.chev + "</span></button>";
    }
    h += "</section>";

  const n = S.workouts.length, unsaved = n - (S.backup && S.backup.n || 0);

  h += '<nav class="foot"><a href="#/history"><b>History</b><small>' + n + " workout" + (n === 1 ? "" : "s") + '</small></a><a href="#/backup" class="' + (n && (!S.backup || unsaved > 0) ? "warn" : "") + '"><b>Backup</b><small>' + bk + "</small></a></nav></div>";
  app.innerHTML = h;
}

    if (e.form && typeof e.form === "object") {
      const links = [["exrx", "ExRx"], ["wiki", "Wiki"], ["yt", "Video"]].filter(k => e.form[k[0]]);
      if (links.length) h += '<p class="ex-form">' + links.map(k => '<a href="' + esc(e.form[k[0]]) + '" target="_blank" rel="noopener">' + k[1] + "</a>").join("") + "</p>";
    }

    e.sets.forEach((x, j) => {
      h += '<div class="set' + (x.done ? " done" : "") + '" data-s="' + j + '"><span class="set-n">' + (j + 1) + "</span>" +
        '<input class="w" inputmode="decimal" autocomplete="off" enterkeyhint="next" placeholder="' + (e.log === "bodyweight" ? "—" : e.log === "assist" ? "pin" : "lb") + '" aria-label="Set ' + (j + 1) + ' weight" value="' + esc(x.w) + '">' +
        '<input class="r" inputmode="numeric" autocomplete="off" enterkeyhint="done" placeholder="reps" aria-label="Set ' + (j + 1) + ' reps" value="' + esc(x.r) + '">' +
        '<button class="chk" data-act="check" aria-pressed="' + (x.done ? "true" : "false") + '" aria-label="Set ' + (j + 1) + ' done">' + ICON.check + "</button></div>";
    });

  });
  app.innerHTML = h + "</div>";
  const tick = () => { const c = $("#clock"); if (c && S.draft) c.textContent = mmss((Date.now() - Date.parse(S.draft.startedAt)) / 1000); };
  tick(); clock = setInterval(tick, 1000); progress(); grow($(".snote"));
}
function progress() { const d = S.draft, p = $(".prog i"); if (d && p) { const a = allSets(d); p.style.width = (a ? Math.min(100, doneSets(d) / a * 100) : 0) + "%"; } }
function grow(ta) { if (ta) { ta.style.height = "auto"; ta.style.height = Math.max(50, ta.scrollHeight + 2) + "px"; } }

/* ---------- history ---------- */

/* ---------- backup ---------- */
let SAVE = null;          // { lines, text } for the current state, built when the view opens
let RESTORE = [];         // blocks of raw lines read so far (pasted text or images)
let NOTE = "";            // one-time line shown above the current code after codes were added
function viewBackup() {
  RESTORE = [];
  const n = S.workouts.length;
  app.innerHTML = '<div class="view"><div class="bar"><button class="back" data-act="home">' + ICON.back + 'Home</button><h1>Backup</h1><span class="side"></span></div>' +

    '<textarea class="code" id="load-text" placeholder="Paste save codes here" autocapitalize="characters" autocomplete="off" autocorrect="off" spellcheck="false"></textarea>' +
    '<div class="stack" style="margin-top:10px"><button class="btn ink" data-act="restore-text">Add this code</button>' +

  if (navigator.storage && navigator.storage.persisted) navigator.storage.persisted().then(p => { const el = $("#persist"); if (el) el.textContent = p ? "The browser has marked this storage as persistent." : "The browser may clear it without asking."; }).catch(() => {});
  SAVE = null; NOTE = "";
  encodeSave(S.workouts).then(sv => {
    SAVE = sv; const ta = $("#save-text"); if (!ta) return;
    ta.value = sv.lines.map(showLine).join("\n");
    const pages = Math.ceil(sv.lines.length / PAGE);
    $("#save-stats").textContent = sv.chars.toLocaleString() + " letters · " + sv.lines.length + " lines · " + pages + " image" + (pages > 1 ? "s" : "");
    app.querySelectorAll('[data-act="copy-save"],[data-act="save-image"]').forEach(b => b.disabled = false);
  }).catch(e => { const ta = $("#save-text"); if (ta) ta.value = "Could not build the save code: " + e.message; });
}
function markBackup() { S.backup = { at: new Date().toISOString(), n: S.workouts.length }; save(); }

/* =====================================================================
   Events
   ===================================================================== */
document.addEventListener("click", ev => {
  const b = ev.target.closest("[data-act]"); if (!b) return;
  const act = b.dataset.act;
  if (act === "start") return startRoutine(b.dataset.id);
  if (act === "resume") return go("#/session");
  if (act === "discard") { if (S.draft && confirm("Discard the unfinished " + S.draft.name + "? Its checked sets are lost.")) { S.draft = null; save(); render(); } return; }
  if (act === "home") return go("#/");
  if (act === "history") return go("#/history");
  if (act === "theme") { S.theme = S.theme === "stealth" ? "default" : "stealth"; save(); applyTheme(); return render(); }
  if (act === "open") return go("#/history/" + b.dataset.i);
  if (act === "finish") return finish();
  if (act === "timer-toggle") { T.open = !T.open; return renderDock(); }
  if (act === "timer-stop") { ev.stopPropagation(); return stopRest(); }
  if (act === "timer-add") { if (T.state === "run") { T.endAt += 30000; T.total += 30; tickRest(); } return; }
  if (act === "copy-sum") { const w = S.workouts[+b.dataset.i]; if (w) copyText(summary(w)).then(ok => { if (ok) toast("Summary copied"); else { selectNode($(".sum")); toast("Copy failed — the text is selected, copy it by hand.", 5000); } }); return; }
  if (act === "delete") { const i = +b.dataset.i, w = S.workouts[i]; if (w && confirm("Delete " + (w.name || "this workout") + " from " + day(w.startedAt) + "? This cannot be undone.")) { S.workouts.splice(i, 1); save(); go("#/history"); toast("Deleted"); } return; }
  if (act === "copy-save") { if (SAVE) copyText(SAVE.text).then(ok => { if (ok) { markBackup(); toast("Save code copied · " + SAVE.chars.toLocaleString() + " letters"); } else { const ta = $("#save-text"); ta.focus(); ta.select(); toast("Copy failed — the text is selected, copy it by hand.", 5000); } }); return; }
  if (act === "save-image") return makeSaveImages();
  if (act === "share-img") return shareImage(+b.dataset.i);
  if (act === "restore-text") return restoreFromText();
  if (act === "export") return exportJSON();

  const exEl = b.closest(".ex"); if (!exEl || !S.draft) return;
  const e = S.draft.exercises[+exEl.dataset.i];
  if (act === "skip") { e.skipped = !e.skipped; save(); exEl.classList.toggle("skipped", e.skipped); b.textContent = e.skipped ? "Undo skip" : "Skip"; return progress(); }
  if (act === "check") {
    const row = b.closest(".set"), x = e.sets[+row.dataset.s];
    x.done = !x.done; save();
    row.classList.toggle("done", x.done); b.setAttribute("aria-pressed", x.done ? "true" : "false"); progress();
    if (x.done) { audioReady(); try { navigator.vibrate && navigator.vibrate(12); } catch (err) {} startRest(e.rest, e.name); }
  }
});
document.addEventListener("keydown", ev => { if ((ev.key === "Enter" || ev.key === " ") && ev.target.matches('label.btn,[role="button"]')) { ev.preventDefault(); ev.target.click(); } });
// Every keystroke lands in the draft.
document.addEventListener("input", ev => {

  if (el.classList.contains("snote")) { S.draft.note = el.value; grow(el); return save(); }
  const row = el.closest(".set"), exEl = el.closest(".ex"); if (!row || !exEl) return;

/* =====================================================================
   Save codes
   16 letters that OCR does not confuse, 2 letters per byte. A code is
   lines of 40 payload letters + 4 check letters. The check is a CRC of
   (code id, line number, payload), so every line knows which code it
   belongs to and where: lines from many codes can arrive mixed, out of
   order or twice and still be sorted, a bad line is located and often
   repaired. A CRC-32 covers each code. Codes merge by workout.
   No compatibility between formats before 1.0: bump FORMAT when the
   record or the guessing changes, and old codes are simply not read.
   ===================================================================== */
const A16 = "ACDEHKLNPRSTUXYZ", LINE = 40, CHK = 4, FULL = LINE + CHK, PAGE = 180;
const utf8 = new TextEncoder(), utf8d = new TextDecoder();
const CRC_T = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
function crc32(u8) { let c = 0xFFFFFFFF; for (let i = 0; i < u8.length; i++) c = CRC_T[(c ^ u8[i]) & 255] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
function chk16(str) { const v = crc32(utf8.encode(str)) & 0xFFFF; return A16[v >>> 12] + A16[v >>> 8 & 15] + A16[v >>> 4 & 15] + A16[v & 15]; }
// The check ties each line to its code (id = the body CRC) and to its place in it.
const lineCheck = (id, idx, payload) => chk16(id + ":" + idx + ":" + payload);
function toLetters(u8) { let s = ""; for (let i = 0; i < u8.length; i++) s += A16[u8[i] >> 4] + A16[u8[i] & 15]; return s; }
function fromLetters(s) { const u = new Uint8Array(s.length >> 1); for (let i = 0; i < u.length; i++) u[i] = A16.indexOf(s[2 * i]) << 4 | A16.indexOf(s[2 * i + 1]); return u; }
const showLine = l => l.slice(0, -CHK).match(/.{1,5}/g).join(" ") + "  " + l.slice(-CHK);

/* What a code holds: for each workout its card, start minute, length in minutes, the session note, and for each lift
   the sets that were checked (weight x reps) plus whether it was skipped.
   Left out on purpose, to keep codes short: unchecked sets, the unfinished session, the theme, seconds, and the card
   text of the day (targets, cues, notes, rests). A workout that comes back from a code shows what was lifted, not
   what the card said that day. The JSON export keeps everything.

   How it gets short. Nothing is written as text if it can be a guess that turned out right:
     - cards and lifts are their numbers in CARD_IDS and LIFTS (anything unlisted is spelled out);
     - the list of lifts is guessed to be the one this card had last time;
     - a weight is guessed to be the weight of the set before it, or what this lift opened with last time;
     - reps are guessed to be what the same set got last time;
     - a wrong guess is written as the step up or down from it.
   A right guess costs a fraction of a bit, because the coder below learns how often each kind of guess is right.
   The guesses use only what is earlier in the same code plus the two numbered lists, never the current text of a
   card, so editing a card does not change what an old code means. */
const EPOCH_MIN = Date.UTC(2020, 0, 1) / 60000;
const startMin = w => Math.floor(Date.parse(w.startedAt) / 60000) || 0;
const asNum = (t, scale) => scale === 4 ? (/^\d{1,6}(\.\d{1,2})?$/.test(t) && Number.isInteger(+t * 4) ? +t * 4 : null) : /^\d{1,4}$/.test(t) ? +t : null;   // weights in quarter units, reps whole
const fmtNum = (n, scale) => String(n / scale);
// The plain record of a log: exactly what a code carries, in a fixed shape. encode(canon) -> decode gives canon back.
function canon(workouts) {
  const T = (v, n) => utf8d.decode(utf8.encode(Array.from(String(v == null ? "" : v).trim()).slice(0, n).join(""))).trim(),
    val = (v, scale) => { const t = T(v, 40), n = asNum(t, scale); return n == null ? t : fmtNum(n, scale); };
  return workouts.map(w => {
    const id = T(w.routineId, 60), listed = CARD_IDS.includes(id), t = Math.max(0, startMin(w) - EPOCH_MIN), fin = Date.parse(w.finishedAt);
    return { c: id, cn: listed ? "" : T(w.name, 60), t, d: isNaN(fin) ? 0 : Math.min(60000, Math.max(1, Math.round(fin / 60000) - EPOCH_MIN - t)), n: T(w.note, 300),
      x: (w.exercises || []).map(e => { const name = T(e.name, 80), s = e.skipped ? 1 : 0;
        return { l: name, g: LIFTS.some(l => l[0] === name) ? "" : T(e.log, 20), o: e.optional ? 1 : 0, s, v: s ? [] : (e.sets || []).filter(x => x && x.done).map(x => [val(x.w, 4), val(x.r, 1)]) }; }) };
  }).sort((a, b) => a.t - b.t);
}
function fromCanon(o) {
  const r = routine(o.c), w = { routineId: o.c, name: o.cn || (r ? r.name : o.c), startedAt: new Date((o.t + EPOCH_MIN) * 60000).toISOString(), note: o.n };
  if (o.d) w.finishedAt = new Date((o.t + o.d + EPOCH_MIN) * 60000).toISOString();
  w.exercises = o.x.map(e => { const l = LIFTS.find(l => l[0] === e.l),
    x = { name: e.l, repTarget: "", rest: 0, target: "", note: "", log: l ? l[1] : e.g, cue: "", form: null, optional: !!e.o, sets: e.v.map(v => ({ w: v[0], r: v[1], done: true })) };
    if (e.s) x.skipped = true; return x; });
  return w;
}
/* The range coder from LZMA. bit(k, b) writes one yes/no at close to its true cost: it keeps odds for every key k and
   updates them as it goes, so a guess that is nearly always right costs nearly nothing. Whole-number arithmetic only,
   so every browser produces the same letters. Given bytes it reads instead of writes; the same calls then return what
   was written. */
function coder(input) {
  const P = new Map(), out = [], enc = !input;
  let low = 0, range = 0xFFFFFFFF, cache = 0, pending = 1, code = 0, pos = 0;
  if (!enc) for (let i = 0; i < 4; i++) code = code * 256 + (pos < input.length ? input[pos++] : 0);
  const shift = () => {
    if (low < 0xFF000000 || low >= 0x100000000) {
      const carry = low >= 0x100000000 ? 1 : 0;
      do { out.push(cache + carry & 255); cache = 255; } while (--pending);
      cache = Math.floor(low / 0x1000000) & 255;
    }
    pending++; low = low % 0x1000000 * 256;
  };
  const bit = (k, b) => {
    const p = P.get(k) || 1024, bound = (range >>> 11) * p;
    if (enc ? !b : code < bound) { range = bound; P.set(k, p + (2048 - p >> 4)); b = 0; }
    else { if (enc) low += bound; else code -= bound; range -= bound; P.set(k, p - (p >> 4)); b = 1; }
    while (range < 0x1000000) { range *= 256; if (enc) shift(); else code = code * 256 + (pos < input.length ? input[pos++] : 0); }
    return b;
  };
  const num = (k, v) => {                  // a whole number >= 0: how many bits it has, then the bits
    const n = enc ? v + 1 : 0, len = enc ? 31 - Math.clz32(n) : 0; let i = 0, m = 1;
    while (bit(k + "u" + Math.min(i, 12), enc ? i < len : 0)) if (++i > 30) throw new Error("it cannot be read");
    for (let j = i - 1; j >= 0; j--) m = m * 2 + bit(k + "b" + i + (i <= 7 ? ":" + m : "." + j), enc ? n >> j & 1 : 0);
    return m - 1;
  };
  const str = (k, s) => {
    const b = enc ? utf8.encode(s) : null, n = num(k + "#", enc ? b.length : 0);
    if (n > 4000) throw new Error("it cannot be read");
    const o = new Uint8Array(n);
    for (let i = 0; i < n; i++) { let m = 1; for (let j = 7; j >= 0; j--) m = m * 2 + bit(k + m, enc ? b[i] >> j & 1 : 0); o[i] = m & 255; }
    return enc ? s : utf8d.decode(o);
  };
  const end = () => {                      // pick the roundest number in range, so the tail is zeros that need not be written
    low = Math.ceil(low / 0x1000000) * 0x1000000; for (let i = 0; i < 5; i++) shift();
    let n = out.length; while (n > 1 && !out[n - 1]) n--;
    return new Uint8Array(out.slice(1, n));
  };
  return { enc, bit, num, str, end };
}
// One walk for both directions, so writing and reading cannot drift apart: with a list it writes it, without one it
// reads and returns it. Every guess is made from `out`, the part already written or read.
function logCodec(io, list) {
  const enc = io.enc, out = [], lastList = new Map(), mem = new Map(), bad = () => { throw new Error("it cannot be read"); };
  const value = (k, v, guess, scale, alt) => {      // a weight or a rep count: blank, a number, or free text
    if (guess != null && io.bit(k + "=", enc ? v === guess : 0)) return guess;
    if (alt != null && alt !== guess && io.bit(k + "~", enc ? v === alt : 0)) return alt;
    const n = enc ? asNum(v, scale) : null, base = guess != null ? guess : alt, g = base == null ? null : asNum(base, scale);
    if (io.bit(k + "t", enc ? n == null : 0)) return io.bit(k + "e", enc ? v !== "" : 0) ? io.str(k + "s", v) : "";
    let r;
    if (g == null) r = io.num(k + "n", n);
    else if (io.bit(k + "v", enc ? n < g : 0)) r = g - 1 - io.num(k + "-", enc ? g - 1 - n : 0);
    else r = g + 1 + io.num(k + "+", enc ? n - g - 1 : 0);
    if (r < 0) bad();
    return fmtNum(r, scale);
  };
  const sig = x => x.map(e => e.l + "\u0001" + e.g + "\u0001" + e.o).join("\u0002");
  const count = io.num("N", enc ? list.length : 0); let prevT = 0, prevCard = 0;
  if (count > 50000) bad();
  for (let a = 0; a < count; a++) {
    const w = enc ? list[a] : null, o = {};
    const ci = io.num("c" + prevCard, enc ? CARD_IDS.indexOf(w.c) + 1 : 0); prevCard = ci;
    if (ci) { o.c = CARD_IDS[ci - 1] || "card-" + ci; o.cn = ""; } else { o.c = io.str("ci", enc ? w.c : ""); o.cn = io.str("cn", enc ? w.cn : ""); }
    // when: whole days since the workout before, then the minute of the day (its hour is learned, its minute is not)
    const day = Math.floor(prevT / 1440) + io.num("D", enc ? Math.floor(w.t / 1440) - Math.floor(prevT / 1440) : 0); let m = 1;
    for (let j = 10; j >= 0; j--) m = m * 2 + io.bit("m" + (j > 5 ? m : -j), enc ? w.t % 1440 >> j & 1 : 0);
    o.t = day * 1440 + (m & 2047); if ((m & 2047) >= 1440 || o.t < prevT) bad(); prevT = o.t;
    o.d = io.num("d", enc ? w.d : 0);
    o.n = io.bit("n?", enc ? w.n !== "" : 0) ? io.str("n", enc ? w.n : "") : "";
    // which lifts: the same list as this card had last time, or spelled out
    const q = lastList.get(o.c);
    if (q && io.bit("L=", enc ? sig(w.x) === sig(q) : 0)) o.x = q.map(e => ({ l: e.l, g: e.g, o: e.o }));
    else {
      const n = io.num("L#", enc ? w.x.length : 0); let pl = 0; if (n > 300) bad(); o.x = [];
      for (let i = 0; i < n; i++) {
        const e = enc ? w.x[i] : null, li = io.num("l" + pl, enc ? LIFTS.findIndex(l => l[0] === e.l) + 1 : 0), r = {}; pl = li;
        if (li) { r.l = (LIFTS[li - 1] || ["lift-" + li])[0]; r.g = ""; } else { r.l = io.str("ln", enc ? e.l : ""); r.g = io.str("lg", enc ? e.g : ""); }
        r.o = io.bit("o" + li, enc ? e.o : 0); o.x.push(r);
      }
    }
    // what was done on each
    o.x.forEach((r, i) => {
      const e = enc ? w.x[i] : null, key = o.c + "\u0001" + r.l, was = mem.get(key), old = was ? was.v : [];
      r.s = io.bit("s" + (was ? was.s : 2) + r.o, enc ? e.s : 0); r.v = [];
      if (!r.s) {
        const n = old.length && io.bit("#=", enc ? e.v.length === old.length : 0) ? old.length : io.num("#", enc ? e.v.length : 0);
        if (n > 300) bad();
        for (let j = 0; j < n; j++) {
          const x = enc ? e.v[j] : [], k = j ? 1 : 0, before = j ? r.v[j - 1] : null, then = old[j] || null;
          const wv = value("w" + k, x[0], before ? before[0] : old[0] ? old[0][0] : null, 4, before && then ? then[0] : null);
          const rv = value("r" + k, x[1], then ? then[1] : null, 1, before ? before[1] : null);
          r.v.push([wv, rv]);
        }
      }
      mem.set(key, { s: r.s, v: r.s ? old : r.v });
    });
    lastList.set(o.c, o.x); out.push(o);
  }

}

/* ---------- merging ---------- */
const wkey = w => (w.routineId || "") + "|" + startMin(w);              // one workout = one card started in one minute

  const have = new Set(S.workouts.map(wkey)), add = []; let dupes = 0;
  for (const list of lists) for (const w of list) { const k = wkey(w); if (have.has(k)) dupes++; else { have.add(k); add.push(w); } }
  return { add, dupes };
}
function applyMerge(plan) {
  S.workouts = S.workouts.concat(plan.add).sort((a, b) => startMin(a) - startMin(b));
  S.backup = { at: S.backup && S.backup.at || new Date().toISOString(), n: (S.backup && S.backup.n || 0) + plan.add.length };   // these came out of a code you hold
  save();
}
function applyReplace(st, source) {        // JSON import only: the file becomes the log
  st = normState(st);
  const msg = "Replace what is on this phone (" + plural(S.workouts.length, "workout") + (S.draft ? ", 1 unfinished" : "") + ") with the " + source + " (" + plural(st.workouts.length, "workout") + (st.draft ? ", 1 unfinished" : "") + ")?";
  if (!confirm(msg)) return false;
  st.backup = { at: new Date().toISOString(), n: st.workouts.length };
  S = st; save(); applyTheme(); RESTORE = []; go("#/"); toast("Replaced with " + plural(st.workouts.length, "workout"));

}
function say(html, bad) { const el = $("#load-status"); if (el) { el.innerHTML = html; el.classList.toggle("bad", !!bad); } }

    const old = blocks.some(b => b.some(l => l.length >= 30 && [...l].every(ch => A16.includes(ch))));
    say(old ? "Those letters are not a code this version can read. If it was copied from an earlier version of this page, it is in an old format: codes are not carried across versions yet." :
      "No save code found in that. A code is recognised by its first line, so the top of it has to be included.", true); return false;
  }

    try { good.push(await decodeSave(c)); } catch (e) { c.err = e.message; broken.push(c); }

      "One code is incomplete: " + (c.total - c.missing.length) + " of " + c.total + " lines read, missing line " + c.missing.slice(0, 10).map(i => i + 1).join(", ") + (c.missing.length > 10 ? "…" : "") + ".").join(" ") +
      (broken.length > 4 ? " And " + (broken.length - 4) + " more." : "") + " Add an image or paste that shows the missing lines and it will be picked up.";
    const box = $("#load-text");

function restoreFromText() {

  addFromCodes([rawLines(text)]);
}

/* ---------- save image ---------- */
let SHOTS = [];
async function makeSaveImages() {
  if (!SAVE) return;
  const box = $("#shots"); box.innerHTML = '<p class="fine">Drawing…</p>';
  try { await document.fonts.load('30px "Cousine"'); } catch (e) {}
  const pages = Math.ceil(SAVE.lines.length / PAGE), W = 1080, FS = 30, LH = 46, MX = 70, TOP = 120;
  const stamp = new Date().toLocaleDateString(undefined, { day: "numeric", month: "short", year: "numeric" });
  SHOTS = []; let html = "";

    const part = SAVE.lines.slice(p * PAGE, (p + 1) * PAGE);
    const c = document.createElement("canvas"); c.width = W; c.height = TOP + part.length * LH + 60;
    const g = c.getContext("2d"); g.fillStyle = "#fff"; g.fillRect(0, 0, W, c.height);
    g.textBaseline = "top"; g.fillStyle = "#8a8a8a"; g.font = '22px "Cousine", monospace';
    g.fillText("gym save " + (p + 1) + "/" + pages + " - " + stamp, MX, 52);
    g.fillStyle = "#000"; g.font = FS + 'px "Cousine", monospace';
    part.forEach((l, i) => g.fillText(showLine(l), MX, TOP + i * LH));

    const file = new File([png], "gym-save-" + new Date().toISOString().slice(0, 10) + (pages > 1 ? "-" + (p + 1) : "") + ".png", { type: "image/png" });
    SHOTS.push(file);
    html += '<div class="shot"><img alt="Save image ' + (p + 1) + " of " + pages + '" src="' + URL.createObjectURL(file) + '"><button class="btn" data-act="share-img" data-i="' + p + '">Save / share image' + (pages > 1 ? " " + (p + 1) + " of " + pages : "") + "</button></div>";
  }
  box.innerHTML = '<p class="fine">Keep the image itself where you can — the saved file reads back exactly. A screenshot works too, read by OCR.</p>' + html;

async function shareImage(i) {
  const f = SHOTS[i]; if (!f) return;
  try { if (navigator.canShare && navigator.canShare({ files: [f] })) { await navigator.share({ files: [f] }); return; } } catch (e) { if (e && e.name === "AbortError") return; }
  const a = document.createElement("a"); a.href = URL.createObjectURL(f); a.download = f.name; document.body.appendChild(a); a.click(); a.remove();
}

async function restoreFromImages(files) {
