<!doctype html>
<html lang="en" data-theme="default">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F1EDE4">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gym">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Gym</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
@font-face{font-family:"Barlow";font-weight:400;font-display:swap;src:url(fonts/barlow-400.woff2) format("woff2")}
@font-face{font-family:"Barlow";font-weight:500;font-display:swap;src:url(fonts/barlow-500.woff2) format("woff2")}
@font-face{font-family:"Barlow";font-weight:600;font-display:swap;src:url(fonts/barlow-600.woff2) format("woff2")}
@font-face{font-family:"Barlow Condensed";font-weight:600;font-display:swap;src:url(fonts/barlow-condensed-600.woff2) format("woff2")}
@font-face{font-family:"Barlow Condensed";font-weight:700;font-display:swap;src:url(fonts/barlow-condensed-700.woff2) format("woff2")}
@font-face{font-family:"Cousine";font-weight:400;font-display:swap;src:url(fonts/cousine-400.woff2) format("woff2")}

:root{
  --bg:#F1EDE4; --surface:#FAF8F3; --raised:#FFFFFF; --ink:#191713; --muted:#6B6558; --faint:#A19A8B;
  --line:#D9D2C4; --accent:#D5401C; --on-accent:#FFFFFF; --done-bg:#F6E3DA;
  --shadow:0 1px 0 rgba(25,23,19,.05),0 10px 28px -16px rgba(25,23,19,.28);
  --cond:"Barlow Condensed","Arial Narrow",system-ui,sans-serif; --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"Cousine",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
[data-theme="stealth"]{
  --bg:#09090A; --surface:#111113; --raised:#18181B; --ink:#C9C7C2; --muted:#85837D; --faint:#55534F;
  --line:#242428; --accent:#C9C7C2; --on-accent:#09090A; --done-bg:#1C1C1F; --shadow:none;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.4 var(--body);-webkit-tap-highlight-color:transparent;touch-action:manipulation;
  min-height:100dvh;padding-bottom:calc(var(--dock,0px) + env(safe-area-inset-bottom))}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-user-select:none;user-select:none}
a{color:inherit}
h1,h2,h3,p{margin:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app{max-width:540px;margin:0 auto;padding:0 18px 28px}
.view{animation:in .16s ease-out}
@keyframes in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* ---------- shared ---------- */
.caps{font:600 12.5px/1 var(--cond);letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:56px;padding:0 20px;border:1.5px solid var(--ink);border-radius:14px;background:transparent;
  font:700 20px/1 var(--cond);letter-spacing:.08em;text-transform:uppercase;transition:transform .08s,opacity .15s}
.btn:active{transform:scale(.985)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.ink{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.quiet{border-color:var(--line);font-size:17px;min-height:50px}
.btn.danger{border-color:var(--line);color:var(--accent)}
.btn[disabled]{opacity:.4;pointer-events:none}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow)}
.bar{position:sticky;top:0;z-index:5;display:grid;grid-template-columns:76px 1fr 76px;align-items:center;margin:0 -18px;padding:calc(10px + env(safe-area-inset-top)) 12px 10px;background:var(--bg);border-bottom:1px solid var(--line)}
.bar h1{font:700 22px/1.1 var(--cond);letter-spacing:.06em;text-transform:uppercase;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .back{justify-self:start;display:flex;align-items:center;gap:2px;min-height:44px;padding:0 8px 0 2px;border:0;background:none;font:600 16px var(--body);color:var(--muted)}
.bar .side{justify-self:end;padding-right:6px;font:600 20px/1 var(--cond);letter-spacing:.04em;font-variant-numeric:tabular-nums;color:var(--muted)}
.empty{padding:44px 8px;text-align:center;color:var(--muted)}
.fine{font-size:14px;color:var(--muted);line-height:1.45}
.fine b{color:var(--ink);font-weight:600}

/* ---------- home ---------- */
.top{display:flex;align-items:flex-end;justify-content:space-between;padding:calc(20px + env(safe-area-inset-top)) 2px 16px}
.mark{display:flex;align-items:baseline;gap:10px}
.mark b{font:700 46px/.82 var(--cond);letter-spacing:.01em}
.mark b i{font-style:normal;color:var(--accent)}
.mark span{font:400 11.5px/1 var(--mono);color:var(--faint)}
.theme{min-height:44px;padding:0 14px;border:1px solid var(--line);border-radius:999px;background:transparent;font:600 12.5px/1 var(--cond);letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.due{position:relative;overflow:hidden}
.due .caps{display:flex;justify-content:space-between}
.due h2{margin:10px 0 2px;font:700 46px/.95 var(--cond);letter-spacing:.005em;text-transform:uppercase}
.due .venue{font-weight:500;color:var(--muted)}
.due ul{list-style:none;margin:14px 0 16px;padding:0;border-top:1px solid var(--line)}
.due li{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:15.5px}
.due li b{font:600 18px/1.2 var(--cond);letter-spacing:.03em;white-space:nowrap}
.due .unset{margin:10px 0 0;color:var(--muted);font-size:15px}
.resume{margin-bottom:14px;border-color:var(--ink)}
.resume h2{margin:8px 0 2px;font:700 30px/1 var(--cond);text-transform:uppercase}
.resume p{color:var(--muted);font-size:15px;margin-bottom:14px}
.resume .row2{grid-template-columns:2fr 1fr}
.lane{margin-top:30px}
.lane-h{display:flex;align-items:baseline;justify-content:space-between;padding:0 2px 8px;border-bottom:2px solid var(--ink)}
.lane-h h3{font:700 15px/1 var(--cond);letter-spacing:.2em;text-transform:uppercase}
.lane-h span{font-size:13.5px;color:var(--muted)}
.rt{display:grid;grid-template-columns:1fr auto;align-items:center;gap:12px;width:100%;min-height:68px;padding:11px 2px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left}
.rt:active{background:var(--surface)}
.rt b{display:block;font:600 25px/1.05 var(--cond);letter-spacing:.02em;text-transform:uppercase}
.rt small{display:block;margin-top:3px;font-size:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rt .go{display:flex;align-items:center;gap:8px;color:var(--faint)}
.pill{padding:5px 8px 4px;border-radius:6px;background:var(--accent);color:var(--on-accent);font:700 12px/1 var(--cond);letter-spacing:.14em}
.foot{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:30px}
.foot a{display:block;padding:14px 16px;border:1px solid var(--line);border-radius:14px;text-decoration:none;background:var(--surface)}
.foot a b{display:block;font:700 19px/1 var(--cond);letter-spacing:.08em;text-transform:uppercase}
.foot a small{display:block;margin-top:5px;font-size:13.5px;color:var(--muted)}
.foot a.warn small{color:var(--accent)}

/* ---------- session ---------- */
.prog{position:sticky;top:calc(65px + env(safe-area-inset-top));z-index:4;height:3px;margin:0 -18px;background:var(--line)}
.prog i{display:block;height:100%;width:0;background:var(--accent);transition:width .25s}
.snote{display:block;width:100%;margin:16px 0 4px;padding:13px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);resize:none;min-height:50px}
.snote::placeholder{color:var(--faint)}
.ex{margin-top:14px;padding:18px 16px 14px;border:1px solid var(--line);border-radius:18px;background:var(--surface);box-shadow:var(--shadow)}
.ex-h{display:grid;grid-template-columns:auto 1fr auto;align-items:start;gap:10px}
.ex-n{font:700 15px/1.75 var(--cond);letter-spacing:.08em;color:var(--faint);font-variant-numeric:tabular-nums}
.ex h2{font:700 27px/1.02 var(--cond);letter-spacing:.015em;text-transform:uppercase}
.skip{min-height:44px;margin:-8px -4px 0 0;padding:0 12px;border:1px solid var(--line);border-radius:999px;background:none;font:600 12px/1 var(--cond);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.ex-meta{margin-top:8px;font-size:15.5px;color:var(--muted)}
.ex-meta b{font-weight:600;color:var(--ink)}
.ex-log{display:flex;gap:8px;align-items:baseline;margin-top:8px;font-size:14.5px;color:var(--muted)}
.tag{flex:none;padding:3px 6px 2px;border:1px solid var(--line);border-radius:5px;font:700 11.5px/1 var(--cond);letter-spacing:.14em;text-transform:uppercase;color:var(--ink)}
.tag.opt{color:var(--muted)}
.ex-cue{margin-top:8px;font-size:15px;font-style:italic}
.ex-note{margin-top:6px;font-size:14.5px;color:var(--muted)}
.ex-form{display:flex;gap:16px;margin-top:8px;font-size:14px}
.ex-form a{color:var(--muted);text-underline-offset:3px}
.sets{margin-top:14px}
.set-h,.set{display:grid;grid-template-columns:30px 1fr 1fr 60px;gap:8px;align-items:center}
.set-h{padding:0 0 6px}
.set-h span{font:600 11.5px/1 var(--cond);letter-spacing:.16em;text-transform:uppercase;color:var(--faint);text-align:center}
.set-h span:first-child{text-align:left}
.set{margin-top:8px}
.set:first-of-type{margin-top:0}
.set-n{font:700 20px/1 var(--cond);color:var(--faint);font-variant-numeric:tabular-nums}
.set input{width:100%;min-width:0;height:54px;padding:0 6px;border:1.5px solid var(--line);border-radius:12px;background:var(--raised);text-align:center;font:600 26px/1 var(--cond);letter-spacing:.02em;font-variant-numeric:tabular-nums;-moz-appearance:textfield}
.set input::placeholder{color:var(--faint);font-weight:600;font-size:17px;letter-spacing:.1em}
.set input:focus{outline:0;border-color:var(--ink)}
.chk{display:grid;place-items:center;height:54px;border:1.5px solid var(--line);border-radius:12px;background:var(--raised);color:transparent;transition:transform .1s,background .12s,border-color .12s}
.chk svg{width:26px;height:26px}
.chk:active{transform:scale(.94)}
.set.done .chk{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.set.done input{background:var(--done-bg);border-color:transparent}
.set.done .set-n{color:var(--ink)}
/* the weight cell is drawn by what its number means: dumbbells beside it, a weight block under it, or parentheses */
.wbox{position:relative;min-width:0;font:600 26px/1 var(--cond);letter-spacing:.02em}
.wbox input{position:relative}
.dbg{fill:var(--faint)}
.wbox .dbg{position:absolute;z-index:1;top:50%;width:22px;height:12px;margin-top:-6px;pointer-events:none}
.wbox .dbg.l{right:calc(50% + var(--n) * .5ch + 5px);transform:rotate(-58deg)}
.wbox .dbg.r{left:calc(50% + var(--n) * .5ch + 5px);transform:rotate(58deg)}
.wbox.ast::before,.wbox.ast::after{position:absolute;z-index:1;top:50%;margin-top:-17px;font:400 30px/1 var(--cond);color:var(--faint);pointer-events:none}
.wbox.ast::before{content:"(";right:calc(50% + var(--n) * .5ch + 1px)}
.wbox.ast::after{content:")";left:calc(50% + var(--n) * .5ch + 1px)}
.set.cur .dbg,.set.done .dbg{fill:var(--ink)}
.set.cur .wbox.ast::before,.set.cur .wbox.ast::after,.set.done .wbox.ast::before,.set.done .wbox.ast::after{color:var(--ink)}
.wblk{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.wb-b{fill:var(--raised);stroke:var(--line);stroke-width:2;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.wb-h{fill:none;stroke:var(--line);stroke-width:3.5;vector-effect:non-scaling-stroke}
.wbox.blk input,.set.cur .wbox.blk input,.set.done .wbox.blk input{padding-top:8px;border-color:transparent;background:none}
.wbox.blk:focus-within .wb-b,.wbox.blk:focus-within .wb-h,.set.cur .wbox .wb-b,.set.cur .wbox .wb-h{stroke:var(--ink)}
.set.done .wbox .wb-b{fill:var(--done-bg);stroke:var(--done-bg)}
.set.done .wbox .wb-h{stroke:var(--done-bg)}
[data-theme="stealth"] .wb-b,[data-theme="stealth"] .wb-h{stroke:var(--faint)}
.ug{display:inline-block;width:11px;height:10px;margin-left:3px;vertical-align:-1px;fill:currentColor}
.ug.db{width:16px;height:9px;vertical-align:-.5px}
/* the set being worked on is the strong one; the ones after it are still only suggestions */
.set:not(.done):not(.cur) input{color:var(--muted)}
.set.cur input{border-color:var(--ink)}
.adj{display:grid;grid-template-columns:30px 1fr 1fr 60px;gap:8px;margin-top:6px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.pair button{height:44px;padding:0;border:1.5px solid var(--line);border-radius:10px;background:none;color:var(--ink);font:600 19px/1 var(--cond);letter-spacing:.02em;font-variant-numeric:tabular-nums}
.pair button:active{background:var(--done-bg);border-color:var(--ink)}
.pair button:disabled{color:var(--faint)}
.ex-last{margin-top:8px;font-size:14.5px;color:var(--muted)}
.ex-last b{font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.bump{display:block;width:100%;min-height:48px;margin-top:10px;padding:10px 12px;border:1.5px solid var(--accent);border-radius:12px;background:none;color:var(--muted);font:400 15px/1.3 var(--body);text-align:left}
.bump b{display:block;font-weight:600;color:var(--ink)}
.ex-f{display:flex;gap:8px;margin-top:10px}
.mini{min-height:44px;padding:0 14px;border:1px solid var(--line);border-radius:999px;background:none;font:600 12px/1 var(--cond);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.mini[hidden]{display:none}
.ex{scroll-margin-top:calc(82px + env(safe-area-inset-top))}
.ex.skipped{box-shadow:none;background:transparent}
.ex.skipped h2{color:var(--faint);text-decoration:line-through;text-decoration-thickness:2px}
.ex.skipped .ex-meta,.ex.skipped .ex-log,.ex.skipped .ex-cue,.ex.skipped .ex-note,.ex.skipped .ex-form,.ex.skipped .sets,.ex.skipped .ex-last,.ex.skipped .bump,.ex.skipped .ex-f{display:none}

/* ---------- dock: timer sits above Finish, never over it ---------- */
#dock{position:fixed;left:0;right:0;bottom:0;z-index:10;padding:0 14px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--bg) 72%,transparent);pointer-events:none}
#dock>div{max-width:512px;margin:0 auto;pointer-events:auto}
#dock:empty{display:none}
.timer{margin-bottom:8px;border:1.5px solid var(--ink);border-radius:14px;background:var(--surface);overflow:hidden;box-shadow:var(--shadow)}
.timer .slim{position:relative;display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:10px;width:100%;min-height:46px;padding:0 6px 0 14px;border:0;background:none;text-align:left}
.timer .fill{position:absolute;inset:0;width:0;background:var(--done-bg);transition:width .25s linear}
.timer .slim>:not(.fill){position:relative}
.timer .lab{font:600 13px/1 var(--cond);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.timer .t{font:700 26px/1 var(--cond);letter-spacing:.03em;font-variant-numeric:tabular-nums}
.timer .x{display:grid;place-items:center;width:44px;height:44px;margin-right:-4px;border:0;background:none;color:var(--muted);font-size:22px;line-height:1}
.timer .big{display:none;padding:6px 14px 16px;text-align:center;border-top:1px solid var(--line)}
.timer.open .big{display:block}
.timer.open .slim .t{visibility:hidden}
.timer .big .t{font-size:88px;line-height:1.05}
.timer .big .row2{margin-top:8px}
.timer.over{border-color:var(--accent)}
.timer.over .slim .t{color:var(--accent)}
.timer.over .fill{width:100%!important;animation:pulse 1.1s ease-in-out 4}
@keyframes pulse{50%{opacity:.25}}

/* ---------- history ---------- */
.hrow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;width:100%;min-height:70px;padding:13px 2px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left}
.hrow b{display:block;font:600 23px/1.05 var(--cond);letter-spacing:.02em;text-transform:uppercase}
.hrow small{display:block;margin-top:4px;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.hrow .n{font:700 22px/1 var(--cond);font-variant-numeric:tabular-nums;text-align:right}
.hrow .n i{font:600 11px/1 var(--cond);font-style:normal;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.hrow .n small{font:400 14px/1 var(--body)}
/* ---------- one workout ---------- */
.wk-head{padding:22px 2px 0}
.wk-eye,.wk-stats span,.wk-rest b{font:600 12px/1 var(--cond);letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.wk-date{margin-top:9px;font:700 44px/.92 var(--cond);letter-spacing:.005em;text-transform:uppercase}
.wk-time{margin-top:9px;font-size:16px;color:var(--muted);font-variant-numeric:tabular-nums}
.wk-stats{display:grid;grid-template-columns:1fr 1fr 1.35fr;margin-top:20px;border-top:2px solid var(--ink);border-bottom:1px solid var(--line)}
.wk-stats div{padding:13px 0 12px 14px}
.wk-stats div:first-child{padding-left:2px}
.wk-stats div+div{border-left:1px solid var(--line)}
.wk-stats b{display:block;margin-bottom:7px;font:700 34px/.9 var(--cond);font-variant-numeric:tabular-nums}
.wk-stats i{font-style:normal;font-weight:600;font-size:20px;color:var(--faint)}
.wk-note{margin:16px 2px 0;font-size:16px;font-style:italic;line-height:1.4;-webkit-user-select:text;user-select:text}
.wk-lift{margin-top:12px;padding:16px 14px 14px 16px;border:1px solid var(--line);border-radius:18px;background:var(--surface);box-shadow:var(--shadow)}
.wk-stats+.wk-lift,.wk-note+.wk-lift{margin-top:18px}
.wk-lh{display:grid;grid-template-columns:22px 1fr auto;gap:8px;align-items:baseline}
.wk-n{font:700 13px/1 var(--cond);letter-spacing:.06em;color:var(--faint);font-variant-numeric:tabular-nums}
.wk-lift h2{font:700 21px/1.05 var(--cond);letter-spacing:.015em;text-transform:uppercase}
.wk-delta{padding-left:6px;font:600 13px/1 var(--cond);letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;color:var(--faint);font-variant-numeric:tabular-nums}
.wk-delta.up{color:var(--accent)}
.wk-kind{display:flex;align-items:center;gap:8px;margin:8px 0 0 30px;font-size:13.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.wk-sets{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0 0 30px}
.wk-sets .wt{position:relative;min-width:0;padding:10px 4px 9px;border:1.5px solid var(--line);border-radius:12px;text-align:center}
.wk-sets b{position:relative;display:flex;align-items:center;justify-content:center;font:600 25px/1 var(--cond);letter-spacing:.01em;font-variant-numeric:tabular-nums;white-space:nowrap}
.wk-sets i{min-width:0;font-style:normal;overflow:hidden;text-overflow:ellipsis}
.wk-sets span{position:relative;display:block;margin-top:5px;font:500 14.5px/1 var(--body);color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wk-sets .dbg{flex:none;width:20px;height:11px;margin:0 1px}
.wk-sets .dbg.l{transform:rotate(-58deg)}
.wk-sets .dbg.r{transform:rotate(58deg)}
.wk-sets .best{border-color:var(--ink);background:var(--raised)}
.wk-sets .best span{color:var(--ink)}
.wk-sets .best .dbg{fill:var(--ink)}
/* a block weight is its own tile: the outline is the weight, and the best set is the solid one */
.wk-sets .blk,.wk-sets .blk.best{padding:17px 4px 10px;border-color:transparent;background:none}
.wk-sets .blk .wb-b{fill:none}
.wk-sets .blk.best .wb-b{fill:var(--ink);stroke:var(--ink)}
.wk-sets .blk.best .wb-h{stroke:var(--ink)}
.wk-sets .blk.best b{color:var(--bg)}
.wk-sets .blk.best span{color:var(--bg);opacity:.72}
.wk-rest{margin:18px 2px 0;font-size:14.5px;line-height:1.55;color:var(--muted)}
.wk-rest b{display:block;margin-bottom:5px}
/* ---------- progress ---------- */
.tabs{display:grid;grid-template-columns:1fr 1fr;margin-top:16px;border:1.5px solid var(--ink);border-radius:12px;overflow:hidden}
.tabs a{display:grid;place-items:center;min-height:44px;font:700 15px/1 var(--cond);letter-spacing:.16em;text-transform:uppercase;text-decoration:none;color:var(--ink)}
.tabs a.on{background:var(--ink);color:var(--bg)}
.chips{display:flex;gap:8px;margin-top:12px}
.chip{flex:1 1 0;min-width:0;min-height:44px;padding:0 8px;border:1px solid var(--line);border-radius:999px;background:none;font:600 13px/1 var(--cond);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip.on{border-color:var(--ink);background:var(--raised);color:var(--ink)}
.pg svg{display:block;width:100%;height:auto;overflow:visible}
.pg text{font:600 11px var(--cond);letter-spacing:.1em;text-transform:uppercase;fill:var(--muted);font-variant-numeric:tabular-nums}
.pg .s-val{font:700 15px var(--cond);letter-spacing:.02em;text-transform:none;fill:var(--ink)}
.pg .b-n{fill:var(--ink)}
.pg .b-0{fill:var(--faint)}
.c-cell{fill:var(--surface);stroke:var(--line);stroke-width:1}
.c-l1,.c-l2,.c-l3{fill:var(--accent);stroke:none}
.c-l1{fill-opacity:.36}
.c-l2{fill-opacity:.66}
.c-now{stroke:var(--ink);stroke-width:1.5}
.b-bar{fill:var(--ink)}
.b-now{fill:var(--accent)}
.g-line{stroke:var(--line);stroke-width:1}
.g-base{stroke:var(--ink);stroke-width:1.5}
.g-lead{stroke:var(--faint);stroke-width:1;stroke-dasharray:2 3}
.s-line{fill:none;stroke:var(--ink);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.s-line.s1{stroke-dasharray:7 5}
.s-line.s2{stroke-dasharray:1 5}
.s-dot{fill:var(--bg);stroke:var(--ink);stroke-width:2}
.s-last{fill:var(--accent);stroke:var(--bg);stroke-width:2}
.pg-cap{display:flex;justify-content:space-between;gap:12px;margin-top:10px;font-size:14px;line-height:1.35;color:var(--muted);font-variant-numeric:tabular-nums}
.pg-cap span:first-child{color:var(--ink)}
.pg-cap span+span{flex:none;text-align:right}
.pg-key{display:flex;align-items:center;gap:4px}
.pg-key i{width:11px;height:11px;border-radius:3px;background:var(--accent)}
.pg-key .k1{margin-left:3px;opacity:.36}
.pg-key .k2{opacity:.66}
.pg-key .k3{margin-right:3px}
.pg-none{margin-top:18px;padding:16px;border:1px dashed var(--line);border-radius:14px;font-size:15.5px;line-height:1.4;color:var(--muted)}
.pg-pick{position:relative}
.pg-pick::after{content:"";position:absolute;right:18px;top:50%;width:9px;height:9px;border-right:2px solid var(--ink);border-bottom:2px solid var(--ink);transform:translateY(-70%) rotate(45deg);pointer-events:none}
.pg-pick select{width:100%;min-height:52px;padding:0 44px 0 14px;border:1.5px solid var(--ink);border-radius:12px;background:var(--raised);color:var(--ink);font:700 19px/1.1 var(--cond);letter-spacing:.03em;text-transform:uppercase;-webkit-appearance:none;appearance:none}
.pg .chips.two{margin:10px 0 6px}
.pg-leg{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:8px;font-size:13.5px;color:var(--muted)}
.pg-leg span{display:flex;align-items:center;gap:6px}
.pg-leg svg{width:26px;height:8px}
.pg .fine{margin:8px 0 0}
#pg-lift{scroll-margin-top:calc(84px + env(safe-area-inset-top))}
.lrow{display:grid;grid-template-columns:1fr auto 76px;gap:12px;align-items:center;width:100%;min-height:62px;padding:10px 2px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left}
.lrow b{display:block;font:600 18px/1.1 var(--cond);letter-spacing:.02em;text-transform:uppercase}
.lrow small{display:block;margin-top:4px;font-size:13.5px;color:var(--muted)}
.lrow .v{text-align:right;white-space:nowrap}
.lrow .v b{font-weight:700;font-variant-numeric:tabular-nums;text-transform:none}
.lrow .v small{font:600 12px/1 var(--cond);letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
.lrow .v small.up{color:var(--accent)}
.lrow svg{width:76px;height:26px}
.lrow .s-line{stroke-width:1.75}
.stack>*+*{margin-top:10px}

/* ---------- backup ---------- */
.sec{margin-top:26px}
.sec>h2{padding-bottom:8px;margin-bottom:12px;border-bottom:2px solid var(--ink);font:700 15px/1 var(--cond);letter-spacing:.2em;text-transform:uppercase}
.sec .fine{margin-bottom:12px}
.code{width:100%;height:132px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);font:400 12px/1.6 var(--mono);letter-spacing:.02em;resize:vertical;white-space:pre;overflow:auto}
#load-text{font-size:16px;line-height:1.45}
/* the code on show: every line whole and none hidden, so a screenshot of the page can be read back */
.rcode{margin:0;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);font:400 calc((min(100vw,540px) - 64px) / 31.9)/1.75 var(--mono);white-space:pre;overflow:hidden;-webkit-user-select:text;user-select:text}
.code::placeholder{font-family:var(--body);font-size:15px;letter-spacing:0;color:var(--faint);white-space:normal}
.shots{display:grid;gap:12px;margin-top:12px}
.shot{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
.shot img{display:block;width:100%;height:auto}
.shot .btn{border:0;border-top:1px solid var(--line);border-radius:0;color:#191713;min-height:50px;font-size:16px}
.status{margin-top:12px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;font-size:14.5px;line-height:1.45}
.status.bad{border-color:var(--accent)}
.status:empty{display:none}
input[type=file]{display:none}

#toast{position:fixed;left:50%;bottom:calc(var(--dock,0px) + 22px + env(safe-area-inset-bottom));z-index:20;transform:translate(-50%,12px);max-width:min(92vw,480px);padding:12px 16px;border-radius:12px;background:var(--ink);color:var(--bg);font-weight:500;font-size:15px;text-align:center;opacity:0;pointer-events:none;transition:opacity .18s,transform .18s}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

   A lift that is not listed still works; its name is spelled out in the code, which only costs letters. */

const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pad2 = n => String(n).padStart(2, "0");

function normState(o) {
  o = o && typeof o === "object" ? o : {};
  // The day-pass gym is EoS. Its cards were first named "Unity" (ids unity_*); bring anything logged under that along.
  const eos = w => { if (w && typeof w.routineId === "string" && w.routineId.startsWith("unity_")) { w.routineId = "eos_" + w.routineId.slice(6); if (typeof w.name === "string") w.name = w.name.replace(/^Unity /, "EoS "); } return w; };

    workouts: Array.isArray(o.workouts) ? o.workouts.filter(w => w && typeof w === "object").map(eos) : [],

    backup: o.backup && typeof o.backup === "object" ? o.backup : null

}
function loadState() {
  let raw = null;
  try { raw = localStorage.getItem(KEY); } catch (e) { return normState(null); }

  catch (e) { try { localStorage.setItem(KEY + "_unreadable_" + Date.now(), raw); } catch (e2) {} return normState(null); }
}
let S = loadState(), saveWarned = false;
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); }

   ===================================================================== */

const mmss = sec => { sec = Math.max(0, Math.round(sec)); const m = Math.floor(sec / 60); return (m >= 60 ? Math.floor(m / 60) + ":" + pad2(m % 60) : m) + ":" + pad2(sec % 60); };
const restText = mmss;

function laneOf(id) { id = String(id || ""); return LANES.find(l => l.prefix && id.startsWith(l.prefix)) || LANES[0]; }
const patternOf = id => String(id || "").slice(laneOf(id).prefix.length);
const routine = id => ROUTINES.find(r => r.id === id);

function toast(msg, ms) {
  const t = $("#toast"); t.textContent = msg; t.classList.add("on");

}
async function copyText(text) {
  try { if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(text); return true; } } catch (e) {}
  try {
    const ta = document.createElement("textarea");
    ta.value = text; ta.setAttribute("readonly", ""); ta.style.cssText = "position:fixed;top:0;left:0;opacity:0";
    document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, text.length);
    const ok = document.execCommand("copy"); ta.remove(); return !!ok;
  } catch (e) { return false; }
}

/* =====================================================================
   Sessions
   ===================================================================== */
/* ---------- what the page fills in, so a set is one tap ----------
   All of these are guesses made for speed. Each one can be overruled with a tap, and each is easy to change here.
   - A new session starts as a copy of the last time this card was done: same weight and same reps, set by set.
     History beats the card's defaultWeight/defaultReps; those only fill a lift that has never been logged on this card.
     Loads never come from another card, so one gym's pins do not leak into another's.
   - A lift with no history and no defaultWeight opens at the number its target text starts with ("12.5–15" -> 12.5);
     with no defaultReps it opens at the bottom of its rep range ("10-12" -> 10).
   - The set you are on is the first unchecked one. It gets nudge buttons: weight by one plate, reps by one.
   - A plate is 5, except dumbbells up to 25 and cables under 20 or sitting on a half step, which move by 2.5.
     A card can say otherwise with `step` on the exercise.
   - Changing the weight of a set changes the unchecked sets after it that had the same weight.
   - Checking the last set of a lift scrolls to the next lift that still has sets open.

    const e = (w.exercises || []).find(e => e.name === name && !e.skipped), sets = e ? (e.sets || []).filter(x => x && x.done) : [];

}
function repRange(e) { const m = /(\d+)\s*(?:[-–]\s*(\d+))?/.exec(str(e.repTarget)); return m ? [+m[1], m[2] ? +m[2] : +m[1]] : null; }

}
/* ---------- how a weight is drawn ----------

     a stack, a bar, a bell   the number sits on a weight block

const wKind = (e, w) => e.log === "assist" ? "ast" : e.log === "db" ? "db" : e.log === "bodyweight" || !e.log ? (str(w) ? "blk" : "bw") : "blk";
const DB_RECTS = '<rect y="3" width="3.4" height="6" rx="1.2"/><rect x="4" width="4" height="12" rx="1.6"/><rect x="8" y="4.6" width="6" height="2.8"/><rect x="14" width="4" height="12" rx="1.6"/><rect x="18.6" y="3" width="3.4" height="6" rx="1.2"/>';
const dbSVG = side => '<svg class="dbg ' + side + '" viewBox="0 0 22 12" aria-hidden="true">' + DB_RECTS + "</svg>";

function blockSVG(W, H) {
  const t = 8, s = Math.round(W * .07), c = W / 2;
  return '<svg class="wblk" viewBox="0 0 ' + W + " " + H + '" preserveAspectRatio="none" aria-hidden="true"><path class="wb-h" d="M' + (c - 11) + " " + (t + 1) + "V7Q" + (c - 11) + " 1.8 " + (c - 5.5) + " 1.8H" + (c + 5.5) + "Q" + (c + 11) + " 1.8 " + (c + 11) + " 7V" + (t + 1) + '"/>' +
    '<path class="wb-b" d="M' + (s + 8) + " " + t + "H" + (W - s - 8) + "Q" + (W - s - 1) + " " + t + " " + (W - s + .4) + " " + (t + 7) + "L" + (W - 1.6) + " " + (H - 9) + "Q" + (W - .6) + " " + (H - 1) + " " + (W - 9) + " " + (H - 1) + "H9Q.6 " + (H - 1) + " 1.6 " + (H - 9) + "L" + (s - .4) + " " + (t + 7) + "Q" + (s + 1) + " " + t + " " + (s + 8) + " " + t + 'Z"/></svg>';
}
// The same two marks at letter size, for a change like "+5".
const UNIT = { db: '<svg class="ug db" viewBox="0 0 22 12" role="img" aria-label="per hand">' + DB_RECTS + "</svg>",
  blk: '<svg class="ug" viewBox="0 0 14 13" role="img" aria-label="pounds"><path d="M4.8 3.4V2.5Q4.8.8 6.5.8H7.5Q9.2.8 9.2 2.5V3.4" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M3.6 3H10.4Q11.7 3 12 4.2L13.3 10.6Q13.6 12.4 11.9 12.4H2.1Q.4 12.4.7 10.6L2 4.2Q2.3 3 3.6 3Z"/></svg>' };
const wChange = (log, text) => log === "assist" ? "(" + text + ")" : text + UNIT[log === "db" ? "db" : "blk"];
const wText = (e, w) => str(w) ? (e.log === "assist" ? "(" + str(w) + ")" : str(w)) : e.log === "bodyweight" ? "BW" : "—";      // where there is only text
const charsOf = v => { const t = str(v) || "0"; return Math.max(1, t.length - (t.split(".").length - 1) * .5); };            // how wide a number is, in digits
const fitW = el => { const b = el && el.closest(".wbox"); if (b) b.style.setProperty("--n", charsOf(el.value)); };              // keeps the marks beside the number
function lastLine(e, prev) {
  const ws = prev.sets.map(x => wText(e, x.w)), rs = prev.sets.map(x => str(x.r) || "—");
  return ws.every(w => w === ws[0]) ? ws[0] + " × " + rs.join(", ") : ws.map((w, i) => w + "×" + rs[i]).join(", ");
}
function bumpFor(e, prev) {

  const w = num(prev.sets[0].w); if (!w) return null;
  if (!prev.sets.every(x => num(x.w) === w && num(x.r) != null && num(x.r) >= rr[1])) return null;
  if (!e.sets.every(x => num(x.w) === w)) return null;                      // already moved off last time's weight
  const to = e.log === "assist" ? w - stepFor(e, w, -1) : w + stepFor(e, w, 1);

}

    (showW ? '<div class="pair"><button data-act="nudge" data-f="w" data-d="-1" aria-label="Less weight"' + (w ? "" : " disabled") + ">−" + tidy(stepFor(e, w || 0, -1)) + '</button><button data-act="nudge" data-f="w" data-d="1" aria-label="More weight">+' + tidy(stepFor(e, w || 0, 1)) + "</button></div>" : "<span></span>") +
    '<div class="pair"><button data-act="nudge" data-f="r" data-d="-1" aria-label="One rep fewer">−1</button><button data-act="nudge" data-f="r" data-d="1" aria-label="One rep more">+1</button></div><span></span></div>';

// Put the nudge buttons under set j of this lift (j < 0: nowhere) and mark that row as the one being worked on.
function placeAdj(exEl, e, j) {

function redraw() { const y = window.scrollY; render(); window.scrollTo(0, y); }

function newSession(r) {

    exercises: r.exercises.map(e => {
      const prev = lastTime(r.id, e.name), t = targetLoad(e), rr = repRange(e);

  const today = new Date().toDateString();

/* =====================================================================

   ===================================================================== */
const T = { state: "idle", endAt: 0, total: 0, label: "", open: false, iv: null };

/* =====================================================================
   Views
   ===================================================================== */
let view = "home", clock = null;

window.addEventListener("hashchange", render);

function render() {
  const h = location.hash.replace(/^#\/?/, ""), parts = h.split("/");
  const prev = view;
  view = parts[0] === "session" && S.draft ? "session" : parts[0] === "history" ? "history" : parts[0] === "backup" ? "backup" : parts[0] === "progress" ? "progress" : "home";
  clearInterval(clock); clock = null;
  if (prev === "session" && view !== "session") { wakeOff(); stopRest(); }

  else if (view === "history") { parts[1] != null && parts[1] !== "" ? viewWorkout(+parts[1]) : viewHistory(); }
  else if (view === "backup") viewBackup();

  renderDock();
  if (prev !== view || view !== "session") window.scrollTo(0, 0);
}

/* ---------- home ---------- */

/* ---------- session ---------- */

   what the card said that day. The JSON export keeps everything.

   How it gets short. Nothing is written as text if it can be a guess that turned out right:
     - cards and lifts are their numbers in CARD_IDS and LIFTS (anything unlisted is spelled out);
     - the list of lifts is guessed to be the one this card had last time;
     - a weight is guessed to be the weight of the set before it, or what this lift opened with last time;
     - reps are guessed to be what the same set got last time;
     - a wrong guess is written as the step up or down from it.

  g.putImageData(px, 0, 0); return c;
}
async function restoreFromImages(files) {
  say("Opening " + files.length + " image" + (files.length > 1 ? "s" : "") + "…");
  try {

    for (let i = 0; i < files.length; i++) {
      const f = files[i], inside = pngText(new Uint8Array(await f.arrayBuffer()), "gym-save");
      if (inside) { RESTORE.push(rawLines(inside)); continue; }
      const label = "Reading image " + (i + 1) + " of " + files.length;
      const w = await getOCR(m => say(label + " — " + esc(m.status) + (m.progress != null ? " " + Math.round(m.progress * 100) + "%" : "")));
      say(label + "…");
      const { data } = await w.recognize(await imageCanvas(f));
      RESTORE.push(rawLines(data.text));
    }
    await addFromCodes(RESTORE, true);
  } catch (e) { say("Could not read the image: " + esc(e.message || e), true); }
}

/* ---------- JSON file ---------- */
function exportJSON() {
  const file = new File([JSON.stringify({ workouts: S.workouts, draft: S.draft, theme: S.theme }, null, 1)], "gym-" + new Date().toISOString().slice(0, 10) + ".json", { type: "application/json" });
  const a = document.createElement("a"); a.href = URL.createObjectURL(file); a.download = file.name; document.body.appendChild(a); a.click(); a.remove();
  markBackup(); toast("Exported " + S.workouts.length + " workouts");
}
async function importJSON(file) {
  try {
    const o = JSON.parse(await file.text());
    if (!o || typeof o !== "object" || !Array.isArray(o.workouts)) throw new Error("no workouts list in it");
    applyReplace({ workouts: o.workouts, draft: o.draft || null, theme: o.theme || S.theme }, "file " + file.name);
  } catch (e) { toast("That file is not a tracker export: " + e.message, 5000); }
}

applyTheme(); render();
